name: Build Flet Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala explicitamente a CLI e as ferramentas de imagem locais
          pip install flet flet-cli pillow

      - name: Build APK (Bypass Global Tool)
        run: |
          # Executa o pacote local do site-packages diretamente para ignorar o wrapper global invisível do Actions
          python -m flet_cli.main build apk
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-apk
          path: build/apk/*.apk
