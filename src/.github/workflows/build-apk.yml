name: Build Flet Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli pillow

      - name: Build APK (Bypass Wrapper)
        run: |
          # Executa de forma isolada chamando diretamente a rotina interna do módulo em Python
          python -c "from flet_cli.commands.build import build_command; import sys; sys.argv = ['flet', 'build', 'apk']; build_command()"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-apk
          path: build/apk/*.apk
